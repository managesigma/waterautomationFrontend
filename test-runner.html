<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-suite { margin: 20px 0; border: 1px solid #ccc; padding: 15px; }
        .test-case { margin: 10px 0; padding: 5px; }
        .pass { color: green; }
        .fail { color: red; }
        .summary { font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Data Model Tests</h1>
    <div id="test-results"></div>

    <script type="module">
        import { Contractor, Truck, Order, Payment, FormState } from './js/models.js';

        class TestRunner {
            constructor() {
                this.results = [];
                this.currentSuite = '';
            }

            describe(suiteName, testFn) {
                this.currentSuite = suiteName;
                console.log(`\n=== ${suiteName} ===`);
                testFn();
            }

            test(testName, testFn) {
                try {
                    testFn();
                    this.results.push({ suite: this.currentSuite, name: testName, status: 'pass' });
                    console.log(`✓ ${testName}`);
                } catch (error) {
                    this.results.push({ suite: this.currentSuite, name: testName, status: 'fail', error: error.message });
                    console.log(`✗ ${testName}: ${error.message}`);
                }
            }

            expect(actual) {
                return {
                    toBe: (expected) => {
                        if (actual !== expected) {
                            throw new Error(`Expected ${expected}, got ${actual}`);
                        }
                    },
                    toBeNull: () => {
                        if (actual !== null) {
                            throw new Error(`Expected null, got ${actual}`);
                        }
                    },
                    toEqual: (expected) => {
                        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                            throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
                        }
                    },
                    toBeUndefined: () => {
                        if (actual !== undefined) {
                            throw new Error(`Expected undefined, got ${actual}`);
                        }
                    },
                    toHaveLength: (expected) => {
                        if (actual.length !== expected) {
                            throw new Error(`Expected length ${expected}, got ${actual.length}`);
                        }
                    }
                };
            }

            run() {
                // Test Contractor Model
                this.describe('Contractor Model', () => {
                    this.test('should create contractor with default values', () => {
                        const contractor = new Contractor();
                        this.expect(contractor.id).toBeNull();
                        this.expect(contractor.phone).toBe('');
                        this.expect(contractor.name).toBe('');
                        this.expect(contractor.email).toBe('');
                    });

                    this.test('should validate valid contractor data', () => {
                        const contractor = new Contractor({
                            phone: '+1234567890',
                            name: 'John Doe',
                            email: 'john@example.com'
                        });
                        const result = contractor.validate();
                        this.expect(result.isValid).toBe(true);
                    });

                    this.test('should reject invalid phone numbers', () => {
                        const contractor = new Contractor({
                            phone: '123',
                            name: 'John Doe',
                            email: 'john@example.com'
                        });
                        const result = contractor.validate();
                        this.expect(result.isValid).toBe(false);
                    });

                    this.test('should format phone numbers correctly', () => {
                        const contractor = new Contractor({ phone: '1234567890' });
                        this.expect(contractor.getFormattedPhone()).toBe('(123) 456-7890');
                    });
                });

                // Test Truck Model
                this.describe('Truck Model', () => {
                    this.test('should validate valid truck data', () => {
                        const truck = new Truck({
                            registrationNumber: 'ABC123',
                            capacity: 5000,
                            contractorId: 'contractor-123'
                        });
                        const result = truck.validate();
                        this.expect(result.isValid).toBe(true);
                    });

                    this.test('should format capacity correctly', () => {
                        const truck = new Truck({ capacity: 5000 });
                        this.expect(truck.getFormattedCapacity()).toBe('5,000 L');
                    });

                    this.test('should check availability', () => {
                        const activeTruck = new Truck({ status: 'active' });
                        this.expect(activeTruck.isAvailable()).toBe(true);
                    });
                });

                // Test Order Model
                this.describe('Order Model', () => {
                    this.test('should validate valid order data', () => {
                        const order = new Order({
                            truckId: 'truck-123',
                            requiredLiters: 3000,
                            contractorId: 'contractor-123'
                        });
                        const result = order.validate();
                        this.expect(result.isValid).toBe(true);
                    });

                    this.test('should calculate estimated cost', () => {
                        const order = new Order({ requiredLiters: 1000 });
                        this.expect(order.calculateEstimatedCost(0.1)).toBe(100);
                    });
                });

                // Test Payment Model
                this.describe('Payment Model', () => {
                    this.test('should validate valid payment data', () => {
                        const payment = new Payment({
                            orderId: 'order-123',
                            amount: 150.00
                        });
                        const result = payment.validate();
                        this.expect(result.isValid).toBe(true);
                    });

                    this.test('should check payment status', () => {
                        const successfulPayment = new Payment({ status: 'completed' });
                        this.expect(successfulPayment.isSuccessful()).toBe(true);
                    });
                });

                this.displayResults();
            }

            displayResults() {
                const resultsDiv = document.getElementById('test-results');
                const passed = this.results.filter(r => r.status === 'pass').length;
                const failed = this.results.filter(r => r.status === 'fail').length;

                let html = `<div class="summary">Tests: ${this.results.length}, Passed: ${passed}, Failed: ${failed}</div>`;

                const suites = [...new Set(this.results.map(r => r.suite))];
                suites.forEach(suite => {
                    html += `<div class="test-suite"><h3>${suite}</h3>`;
                    const suiteResults = this.results.filter(r => r.suite === suite);
                    suiteResults.forEach(result => {
                        const className = result.status === 'pass' ? 'pass' : 'fail';
                        const errorMsg = result.error ? ` - ${result.error}` : '';
                        html += `<div class="test-case ${className}">${result.status === 'pass' ? '✓' : '✗'} ${result.name}${errorMsg}</div>`;
                    });
                    html += '</div>';
                });

                resultsDiv.innerHTML = html;
            }
        }

        // Run tests when page loads
        window.addEventListener('load', () => {
            const runner = new TestRunner();
            runner.run();
        });
    </script>
</body>
</html>
