<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Manager Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-suite { margin: 20px 0; border: 1px solid #ccc; padding: 15px; }
        .test-case { margin: 10px 0; padding: 5px; }
        .pass { color: green; }
        .fail { color: red; }
        .summary { font-weight: bold; margin: 20px 0; }
        .error-details { color: red; font-size: 0.9em; margin-left: 20px; }
    </style>
</head>
<body>
    <h1>Authentication Manager Tests</h1>
    <div id="test-results"></div>

    <script type="module">
        import { AuthenticationManager } from './js/auth.js';
        import { runAuthenticationTests } from './js/auth.test.js';

        class TestRunner {
            constructor() {
                this.results = [];
                this.currentSuite = '';
            }

            describe(suiteName, testFn) {
                this.currentSuite = suiteName;
                console.log(`\n=== ${suiteName} ===`);
                testFn();
            }

            test(testName, testFn) {
                try {
                    testFn();
                    this.results.push({ suite: this.currentSuite, name: testName, status: 'pass' });
                    console.log(`✓ ${testName}`);
                } catch (error) {
                    this.results.push({ 
                        suite: this.currentSuite, 
                        name: testName, 
                        status: 'fail', 
                        error: error.message,
                        stack: error.stack 
                    });
                    console.log(`✗ ${testName}: ${error.message}`);
                }
            }

            expect(actual) {
                return {
                    toBe: (expected) => {
                        if (actual !== expected) {
                            throw new Error(`Expected ${expected}, got ${actual}`);
                        }
                    },
                    toBeNull: () => {
                        if (actual !== null) {
                            throw new Error(`Expected null, got ${actual}`);
                        }
                    },
                    toEqual: (expected) => {
                        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                            throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
                        }
                    },
                    toBeUndefined: () => {
                        if (actual !== undefined) {
                            throw new Error(`Expected undefined, got ${actual}`);
                        }
                    },
                    toHaveLength: (expected) => {
                        if (actual.length !== expected) {
                            throw new Error(`Expected length ${expected}, got ${actual.length}`);
                        }
                    }
                };
            }

            async run() {
                // Make AuthenticationManager available globally for tests
                window.AuthenticationManager = AuthenticationManager;
                
                // Run authentication tests
                runAuthenticationTests({
                    describe: this.describe.bind(this),
                    test: this.test.bind(this),
                    expect: this.expect.bind(this)
                });

                this.displayResults();
            }

            displayResults() {
                const resultsDiv = document.getElementById('test-results');
                const passed = this.results.filter(r => r.status === 'pass').length;
                const failed = this.results.filter(r => r.status === 'fail').length;

                let html = `<div class="summary">Tests: ${this.results.length}, Passed: ${passed}, Failed: ${failed}</div>`;

                const suites = [...new Set(this.results.map(r => r.suite))];
                suites.forEach(suite => {
                    html += `<div class="test-suite"><h3>${suite}</h3>`;
                    const suiteResults = this.results.filter(r => r.suite === suite);
                    suiteResults.forEach(result => {
                        const className = result.status === 'pass' ? 'pass' : 'fail';
                        const errorMsg = result.error ? ` - ${result.error}` : '';
                        html += `<div class="test-case ${className}">${result.status === 'pass' ? '✓' : '✗'} ${result.name}${errorMsg}`;
                        if (result.error && result.stack) {
                            html += `<div class="error-details">${result.stack}</div>`;
                        }
                        html += '</div>';
                    });
                    html += '</div>';
                });

                resultsDiv.innerHTML = html;
            }
        }

        // Run tests when page loads
        window.addEventListener('load', async () => {
            const runner = new TestRunner();
            await runner.run();
        });
    </script>
</body>
</html>
