<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Form Validation Test</h1>
            <p class="subtitle">Testing Enhanced Validation and Error Display</p>
        </header>

        <main class="main-content">
            <!-- Global Messages -->
            <div class="message-container">
                <div class="message success" id="successMessage"></div>
                <div class="message error" id="errorMessage"></div>
            </div>

            <!-- Test Form -->
            <section class="workflow-step active">
                <div class="step-header">
                    <h2>Test Form Validation</h2>
                    <p>Try submitting the form with invalid data to see enhanced validation in action.</p>
                </div>

                <div class="form-container">
                    <form id="testForm" class="form">
                        <div class="form-group">
                            <label for="testName">Full Name</label>
                            <input type="text" id="testName" name="name" required 
                                   minlength="2" 
                                   placeholder="John Doe"
                                   title="Name must be at least 2 characters long">
                            <span class="error-message" id="nameError"></span>
                        </div>
                        <div class="form-group">
                            <label for="testEmail">Email</label>
                            <input type="email" id="testEmail" name="email" required 
                                   placeholder="user@example.com"
                                   title="Please enter a valid email address">
                            <span class="error-message" id="emailError"></span>
                        </div>
                        <div class="form-group">
                            <label for="testPhone">Phone Number</label>
                            <input type="tel" id="testPhone" name="phone" required 
                                   placeholder="+1234567890" 
                                   pattern="[\+]?[1-9][\d]{7,14}"
                                   title="Please enter a valid phone number">
                            <span class="error-message" id="phoneError"></span>
                        </div>
                        <div class="form-group">
                            <label for="testCapacity">Capacity</label>
                            <input type="number" id="testCapacity" name="capacity" min="1" max="50000" required 
                                   placeholder="5000"
                                   title="Capacity must be greater than 0">
                            <span class="error-message" id="capacityError"></span>
                        </div>
                        <button type="submit" class="btn btn-primary">Test Validation</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { UIManager } from './js/ui.js';
        
        // Initialize UI Manager
        const uiManager = new UIManager();
        uiManager.initialize();
        
        // Test form submission
        document.getElementById('testForm').addEventListener('submit', (event) => {
            event.preventDefault();
            
            const form = event.target;
            const validationResult = uiManager.validateFormWithEnhancedRules(form);
            
            if (validationResult.isValid) {
                uiManager.displaySuccess('✅ All validation passed! Form is ready for submission.');
            } else {
                uiManager.displayValidationErrors(validationResult.errors);
            }
        });
        
        // Test API error display
        setTimeout(() => {
            const testButton = document.createElement('button');
            testButton.textContent = 'Test API Error Display';
            testButton.className = 'btn btn-secondary';
            testButton.style.marginTop = '20px';
            testButton.addEventListener('click', () => {
                uiManager.displayAPIError('This is a test API error message from the backend', 'Test Operation');
            });
            document.querySelector('.form-container').appendChild(testButton);
        }, 1000);
    </script>
</body>
</html>
